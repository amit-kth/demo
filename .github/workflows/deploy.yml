name: Build and Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Install NPM Dependencies
        run: npm ci

      - name: 4. Build Next.js Application
        run: npm run build

      - name: 5. Prepare Static Assets & Passenger Restart Signal
        run: |
          # Static CSS/JS ko public folder me copy karte hain taaki Apache direct serve kare
          rm -rf public/_next
          mkdir -p public/_next
          cp -r .next/static public/_next/
          
          # Passenger engine ko restart ka signal bhejne ke liye
          mkdir -p tmp
          echo "Restart at $(date +%s)" > tmp/restart.txt

      - name: 6. Deploy files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          git-file-ignore: false
          dangerous-clean-slate: true # Purani unnecessary build files ko cPanel se auto-delete karega
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**
            src/**
            pages/**
            app/**
            README.md
            .env*
            cgi-bin/**
            .htaccess*
            .env.example*